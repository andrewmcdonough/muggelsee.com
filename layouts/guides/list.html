{{ define "main" }}
<div class="container">
  <div class="page-intro">
    <h1>{{ .Title }}</h1>
  </div>
  <div class="guides-list">
    {{ range .Pages.ByWeight }}
    <article class="guide-item">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      {{ with .Summary }}<p>{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</div>
{{ end }}
